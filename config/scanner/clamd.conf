# File scanning policy.
# This file is mounted into the local daemon and validated by the Python adapter.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LogFile /var/log/clamav/clamd.log
LogTime yes
LogFileMaxSize 10M
LocalSocket /run/clamav/clamd.sock
LocalSocketGroup ira-runtime
LocalSocketMode 660
FixStaleSocket yes
TCPSocket 3310
# Docker publishes this port on host loopback only; do not expose it publicly.
TCPAddr 0.0.0.0
MaxThreads 2
MaxQueue 4
CommandReadTimeout 5
ReadTimeout 30
MaxScanTime 60000
StreamMaxLength 50M
MaxFileSize 50M
# Include original input and recursive processing overhead, beyond expanded bytes.
MaxScanSize 300M
MaxFiles 10000
MaxRecursion 8
ScanPDF yes
ScanOLE2 yes
ScanArchive yes
AlertEncryptedDoc yes
AlertEncryptedArchive yes
AlertOLE2Macros yes
AlertExceedsMax yes
HeuristicScanPrecedence no
ConcurrentDatabaseReload no
