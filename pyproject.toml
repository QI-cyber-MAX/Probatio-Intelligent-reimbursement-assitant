[project]
name = "intelligent-reimbursement-assitant"
version = "0.1.0"
description = "Agentic RAG for reimbursement policies and cited question answering"
readme = "README.md"
authors = [
    { name = "陈锴", email = "1950846843@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16,<2",
    "defusedxml==0.7.1",
    "docling-core==2.104.0",
    "docling[rapidocr]==2.142.0",
    "elasticsearch==9.1.3",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-postgres>=3.2.0",
    "lxml>=6.1.3,<7",
    "olefile==0.47",
    "openpyxl>=3.1.5,<4",
    "psutil>=7,<8",
    "psycopg[binary]>=3.2,<4",
    "pydantic==2.14.1",
    "pypdf==6.20.0",
    "pypdfium2>=5.14,<6",
    "python-docx>=1.2,<2",
    "python-multipart==0.0.32",
    "redis>=7.3,<8",
    "sqlalchemy>=2.0,<2.1",
    "starlette==1.7.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
reimbursement-wiki = "intelligent_reimbursement_assitant.entrypoints.wiki:main"
intelligent-reimbursement-assitant = "intelligent_reimbursement_assitant:main"
reimbursement-maintenance = "intelligent_reimbursement_assitant.entrypoints.maintenance:main"
reimbursement-qa = "intelligent_reimbursement_assitant.entrypoints.qa:main"
reimbursement-checkpoints = "intelligent_reimbursement_assitant.entrypoints.checkpoints:main"
reimbursement-ingestion = "intelligent_reimbursement_assitant.entrypoints.ingestion:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pyright>=1.1.414",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportImportCycles = "error"

[tool.importlinter]
root_package = "intelligent_reimbursement_assitant"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Prevent package dependency cycles"
type = "acyclic_siblings"
ancestors = ["intelligent_reimbursement_assitant"]

# Use CPU PyTorch packages on Linux.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

